<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OL Video Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M32 0V32H0Z' fill='%23f26b1d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside>
  <div class="logo"><span class="flag"></span>OL Video Maker</div>
  <ul class="steps" id="steps"></ul>
  <div class="sidefoot">
    <a href="#" id="help">? Hjälp och guide</a>
    <a href="#" id="terms-link">§ Villkor</a>
    Allt görs på din dator.<br>Inget laddas upp.
  </div>
</aside>
<main>
  <header>
    <div class="kickrow"><span class="kicker" id="kicker"></span><span class="tag" id="optional" hidden>Frivilligt</span></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>
  <div id="warn" class="warn" hidden></div>
  <section id="page"></section>
  <footer>
    <button class="back" id="back">‹ Tillbaka</button>
    <div class="hint" id="hint"></div>
    <span class="num" id="nextnum">3</span>
    <button class="next" id="next">Nästa ›</button>
  </footer>
</main>
<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h2 id="m-title"></h2>
    <div id="m-body"></div>
    <div class="m-btns" id="m-btns"></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
